name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare private Windows workspace
        shell: powershell
        run: ./scripts/prepare-windows-ci.ps1
      - name: Build and run headless tests
        shell: powershell
        working-directory: ${{ env.DRAGON_CI_WORKSPACE }}
        run: ./scripts/test.ps1
      - name: Package with bundled demo video
        shell: powershell
        working-directory: ${{ env.DRAGON_CI_WORKSPACE }}
        run: ./scripts/package.ps1
      - name: Check repository and package
        shell: powershell
        working-directory: ${{ env.DRAGON_CI_WORKSPACE }}
        run: ./scripts/verify-repository.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: DragonCodexBoot-windows-x64
          path: |
            ${{ env.DRAGON_CI_WORKSPACE }}/dist/*.zip
            ${{ env.DRAGON_CI_WORKSPACE }}/dist/*.sha256
          if-no-files-found: error
